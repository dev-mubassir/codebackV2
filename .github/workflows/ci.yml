# Tests on every pull request (and on master after a merge).
#
# master is not branch-protected (private repo on GitHub Free), so this is the
# gate you read before merging: a red run means do not merge. Direct pushes to
# master are blocked locally by .githooks/pre-push — see OPERATIONS.md.

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Production runs Postgres 18 (Northflank addon).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI database, not a secret
          POSTGRES_DB: codeback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codeback_test
      TEST_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Public values only: the build refuses a missing or localhost backend URL.
      NEXT_PUBLIC_BACKEND_URL: https://api.siffty.com
      NEXT_PUBLIC_SUPPORT_EMAIL: support@siffty.com
      NEXT_PUBLIC_CASHFREE_MODE: sandbox
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -t siffty-api:ci backend
      - name: Migrate job image
        run: docker build -f backend/Dockerfile.migrate -t siffty-migrate:ci backend
      - name: Frontend image
        run: >-
          docker build -t siffty-web:ci
          --build-arg NEXT_PUBLIC_BACKEND_URL=https://api.siffty.com
          --build-arg NEXT_PUBLIC_SUPPORT_EMAIL=support@siffty.com
          --build-arg NEXT_PUBLIC_CASHFREE_MODE=sandbox
          frontend
